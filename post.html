<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DalFound – Post a found item</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">DalFound</a>
    <nav>
      <a href="index.html">Browse</a>
      <a href="post.html">Post a found item</a>
      <a href="staff.html">Staff</a>
    </nav>
  </header>

  <main>
    <h1>Post a found item</h1>

    <div class="reminders">
      <p>Drop the item off at a drop-off location before you post it.</p>
      <p>Photos must not show personal information, such as a name, face, card number, or address.</p>
    </div>

    <form id="post-form" class="post-form" novalidate>
      <p id="form-message" class="form-message" hidden></p>

      <div class="form-field">
        <label for="photo">Photo</label>
        <input id="photo" name="photo" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
      </div>

      <div class="form-field">
        <label for="category">Category</label>
        <select id="category" name="category"></select>
      </div>

      <div class="form-field">
        <label for="location-found">Location found</label>
        <select id="location-found" name="locationFound"></select>
      </div>

      <div class="form-field">
        <label for="date-found">Date found</label>
        <input id="date-found" name="dateFound" type="date">
      </div>

      <div class="form-field">
        <label for="drop-off">Drop-off location</label>
        <select id="drop-off" name="dropOff"></select>
      </div>

      <button type="submit">Post item</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>DalFound – CSCI 2690 Team 6 prototype. Sample data only.</p>
  </footer>

  <script type="module" src="js/post.js"></script>
</body>
</html>
